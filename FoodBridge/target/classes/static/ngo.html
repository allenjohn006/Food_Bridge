<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGO Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>NGO Dashboard</h1>
    <div class="topbar-actions">
      <span id="whoami"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="grid-two">
    <section class="panel">
      <h2>Create Food Need Request</h2>
      <form id="needForm" class="form-grid">
        <label>Item Needed</label>
        <input id="needItem" required />
        <label>Quantity Needed</label>
        <input id="needQty" required />
        <label>Notes</label>
        <input id="needNotes" placeholder="Optional note" />
        <button type="submit" class="cta">Post Request</button>
      </form>
      <p id="ngoMsg" class="msg"></p>
    </section>

    <section class="panel">
      <h2>Available Donations (Live)</h2>
      <div id="availableDonations" class="cards"></div>
    </section>

    <section class="panel wide">
      <h2>My Claims</h2>
      <table>
        <thead>
          <tr>
            <th>Claim ID</th>
            <th>Food</th>
            <th>Qty</th>
            <th>Donor</th>
            <th>Claimed At</th>
            <th>Meals Fed</th>
          </tr>
        </thead>
        <tbody id="ngoClaims"></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
